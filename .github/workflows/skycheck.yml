name: sky-list
on:
  push:
    branches: [sky-check]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && python run3.py
      - uses: actions/upload-artifact@v4
        with:
          name: skyimgs
          path: out
