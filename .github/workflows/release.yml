name: Build & release Orbit

on:
  push:
    branches: [main, master]
    paths:
      - "orbit_launcher.py"
      - "ui/**"
      - "orbit_preview/**"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        run: |
          v=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('orbit_launcher.py', encoding='utf-8').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$v already exists - bump APP_VERSION in orbit_launcher.py to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pystray pillow
          python -m py_compile orbit_launcher.py
          printf '{"repo": "%s", "version": "%s"}\n' "${{ github.repository }}" "${{ steps.ver.outputs.version }}" > ui/build.json
          python -m PyInstaller --noconfirm --onefile --noconsole --name OrbitLauncher --icon ui/orbit.ico \
            --add-data "ui;ui" --add-data "orbit_preview;orbit_preview" --add-data "CHANGELOG.md;." \
            --hidden-import pystray._win32 orbit_launcher.py
          cp dist/OrbitLauncher.exe dist/OrbitSetup.exe
          (cd dist && sha256sum OrbitLauncher.exe | cut -d' ' -f1 > OrbitLauncher.exe.sha256)
          ls -la dist

      - name: Smoke test the app window
        if: steps.ver.outputs.exists == 'false'
        timeout-minutes: 6
        run: |
          set +e
          for mode in setup app; do
            export ORBIT_SELFTEST_OUT="$PWD/selftest-$mode.json"
            if [ "$mode" = "setup" ]; then exe=dist/OrbitSetup.exe; args="--setup --selftest"; else exe=dist/OrbitLauncher.exe; args="--selftest"; fi
            timeout 150 "$exe" $args
            echo "== $mode exit code: $? =="
            cat "selftest-$mode.json" 2>/dev/null || echo "(no self-test result written)"
            echo
          done
          export ORBIT_SELFTEST_OUT="$PWD/selftest-spawn.json"
          dist/OrbitLauncher.exe --selftest-spawn
          for i in $(seq 1 60); do [ -f selftest-spawn.json ] && break; sleep 2; done
          sleep 3
          echo "== spawn (restart) test =="
          cat selftest-spawn.json 2>/dev/null || echo "(no result)"
          echo
          cat > render_check.py <<'PY'
          import base64, io, sys
          from PIL import ImageGrab
          name = sys.argv[1]
          img = ImageGrab.grab()
          W = img.width
          crop = img.crop((W // 2 - 360, 0, W // 2 + 360, 130)).convert("RGB")
          px = crop.load()
          purple = sum(1 for x in range(crop.width) for y in range(crop.height)
                       if px[x, y][2] > 150 and px[x, y][0] > 90 and px[x, y][1] < 140)
          print(f"RENDER {name}: purple pixels at top center = {purple}")
          small = crop.resize((crop.width // 2, crop.height // 2))
          buf = io.BytesIO(); small.save(buf, "PNG")
          print(f"IMG {name} " + base64.b64encode(buf.getvalue()).decode())
          PY
          dist/OrbitLauncher.exe --orbit-toast "Grow a Garden" "Atlanta, Georgia, US" &
          sleep 3
          python render_check.py banner
          wait
          ORBIT_BADGE_ALWAYS=1 dist/OrbitLauncher.exe --orbit-toast "Grow a Garden" "Atlanta, Georgia, US" --badge &
          sleep 4
          python render_check.py badge
          taskkill //IM OrbitLauncher.exe //F > /dev/null 2>&1
          echo "== launcher.log =="
          cat "$LOCALAPPDATA/OrbitLauncher/launcher.log" 2>/dev/null
          python - <<'PY'
          import json, sys
          ok = True
          for mode in ("setup", "app", "spawn"):
              try:
                  r = json.load(open(f"selftest-{mode}.json"))
              except Exception:
                  print(f"{mode}: no result"); ok = False; continue
              print(mode, "ready:", r.get("ready"), "errors:", r.get("errors"))
              ok = ok and bool(r.get("ready")) and not r.get("errors")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload test screenshots
        if: always() && steps.ver.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: toast-preview.png
          if-no-files-found: ignore

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          python - "$v" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              m = re.search(rf"^## v?{re.escape(v)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
              body = m.group(1).strip() if m else ""
          except OSError:
              body = ""
          print(body or f"Orbit Launcher v{v}")
          print("\n---\n**New here?** Download **OrbitSetup.exe** below and run it. Already installed? Orbit updates itself.")
          PY
          gh release create "v$v" dist/OrbitSetup.exe dist/OrbitLauncher.exe dist/OrbitLauncher.exe.sha256 \
            --title "Orbit Launcher v$v" --notes-file notes.md
