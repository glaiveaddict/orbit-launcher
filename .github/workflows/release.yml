name: Build & release Orbit

on:
  push:
    branches: [main, master]
    paths:
      - "orbit_launcher.py"
      - "ui/**"
      - "orbit_preview/**"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        run: |
          v=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('orbit_launcher.py', encoding='utf-8').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$v already exists - bump APP_VERSION in orbit_launcher.py to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pystray pillow
          python -m py_compile orbit_launcher.py
          printf '{"repo": "%s", "version": "%s"}\n' "${{ github.repository }}" "${{ steps.ver.outputs.version }}" > ui/build.json
          mkdir -p ui/avatars
          python - <<'PY'
          import json, urllib.request
          for uid in (9544724076,):
              try:
                  url = f"https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds={uid}&size=420x420&format=Png&isCircular=false"
                  img = json.load(urllib.request.urlopen(url, timeout=20))["data"][0]["imageUrl"]
                  data = urllib.request.urlopen(img, timeout=20).read()
                  open(f"ui/avatars/{uid}.png", "wb").write(data)
                  print(f"Bundled avatar {uid} ({len(data)} bytes)")
              except Exception as e:
                  print(f"Avatar {uid} skipped: {e}")
          PY
          python -m PyInstaller --noconfirm --onedir --noconsole --name OrbitHelper --icon ui/orbit.ico \
            --add-data "ui/build.json;ui" --exclude-module webview --exclude-module clr --exclude-module clr_loader \
            --exclude-module pythonnet --exclude-module PIL --exclude-module pystray orbit_launcher.py
          python -c "import shutil; shutil.make_archive('helper', 'zip', 'dist/OrbitHelper')"
          ls -la helper.zip
          python -m PyInstaller --noconfirm --onefile --noconsole --name OrbitLauncher --icon ui/orbit.ico \
            --add-data "ui;ui" --add-data "orbit_preview;orbit_preview" --add-data "CHANGELOG.md;." \
            --add-data "helper.zip;." --hidden-import pystray._win32 orbit_launcher.py
          cp dist/OrbitLauncher.exe dist/OrbitSetup.exe
          (cd dist && sha256sum OrbitLauncher.exe | cut -d' ' -f1 > OrbitLauncher.exe.sha256)
          ls -la dist

      - name: Smoke test the app window
        if: steps.ver.outputs.exists == 'false'
        timeout-minutes: 6
        run: |
          set +e
          for mode in setup app; do
            export ORBIT_SELFTEST_OUT="$PWD/selftest-$mode.json"
            if [ "$mode" = "setup" ]; then exe=dist/OrbitSetup.exe; args="--setup --selftest"; else exe=dist/OrbitLauncher.exe; args="--selftest"; fi
            timeout 150 "$exe" $args
            echo "== $mode exit code: $? =="
            cat "selftest-$mode.json" 2>/dev/null || echo "(no self-test result written)"
            echo
          done
          export ORBIT_SELFTEST_OUT="$PWD/selftest-spawn.json"
          dist/OrbitLauncher.exe --selftest-spawn
          for i in $(seq 1 60); do [ -f selftest-spawn.json ] && break; sleep 2; done
          sleep 3
          echo "== spawn (restart) test =="
          cat selftest-spawn.json 2>/dev/null || echo "(no result)"
          echo
          cat > render_check.py <<'PY'
          import base64, io, sys
          from PIL import ImageGrab
          name = sys.argv[1]
          img = ImageGrab.grab(include_layered_windows=True)
          W = img.width
          full = img.convert("RGB"); fp = full.load()
          hits = [(x, y) for x in range(0, full.width, 2) for y in range(0, min(full.height, 400), 2)
                  if fp[x, y][2] > 150 and fp[x, y][0] > 90 and fp[x, y][1] < 140]
          if hits:
              xs, ys = [h[0] for h in hits], [h[1] for h in hits]
              print(f"FOUND {name}: {len(hits)} purple samples, box x={min(xs)}-{max(xs)} y={min(ys)}-{max(ys)}, screen {full.size}")
          else:
              print(f"FOUND {name}: nothing purple in the top 400px, screen {full.size}")
          box = {"badge": (W - 460, 40, W, 120), "badgehidden": (W - 460, 40, W, 120), "keys": (W - 260, img.height - 360, W, img.height)}.get(name, (W // 2 - 360, 0, W // 2 + 360, 130))
          crop = img.crop(box).convert("RGB")
          px = crop.load()
          purple = sum(1 for x in range(crop.width) for y in range(crop.height)
                       if px[x, y][2] > 150 and px[x, y][0] > 90 and px[x, y][1] < 140)
          print(f"RENDER {name}: purple pixels in its area = {purple}")
          small = crop.resize((crop.width // 2, crop.height // 2))
          buf = io.BytesIO(); small.save(buf, "PNG")
          print(f"IMG {name} " + base64.b64encode(buf.getvalue()).decode())
          PY
          dist/OrbitLauncher.exe --prepare
          HELPER="$LOCALAPPDATA/Programs/Orbit/helper-${{ steps.ver.outputs.version }}/OrbitHelper.exe"
          echo "== helper =="; ls -la "$(dirname "$HELPER")" || echo "(no helper folder)"
          python - "$HELPER" <<'PY'
          import os, pathlib, subprocess, sys, time
          log = pathlib.Path(os.environ["LOCALAPPDATA"]) / "OrbitLauncher" / "launcher.log"
          def timed(label, exe):
              before = log.read_text(errors="ignore").count("Badge placed") if log.exists() else 0
              t = time.time()
              p = subprocess.Popen([exe, "--orbit-toast", "BedWars", "Ashburn, Virginia, US", "--badge"],
                                   env={**os.environ, "ORBIT_BADGE_ALWAYS": "1"})
              while time.time() - t < 60:
                  if log.exists() and log.read_text(errors="ignore").count("Badge placed") > before:
                      break
                  time.sleep(0.05)
              dt = time.time() - t
              subprocess.run(["taskkill", "/PID", str(p.pid), "/T", "/F"], capture_output=True)
              print(f"SPEED {label}: badge on screen after {dt:.2f}s")
              time.sleep(1)
          for i in range(2):
              timed(f"old way (one big exe), run {i + 1}", "dist/OrbitLauncher.exe")
              timed(f"fast helper, run {i + 1}", sys.argv[1])
          PY
          "$HELPER" --orbit-toast "Grow a Garden" "Atlanta, Georgia, US" &
          sleep 3
          python render_check.py banner
          wait
          ORBIT_BADGE_ALWAYS=1 "$HELPER" --orbit-toast "Grow a Garden" "Atlanta, Georgia, US" --badge --ip 8.8.8.8 --joined $(( $(date +%s) - 754 )) &
          sleep 4
          python render_check.py badge
          taskkill //IM OrbitHelper.exe //F > /dev/null 2>&1
          "$HELPER" --orbit-toast "Grow a Garden" "Atlanta, Georgia, US" --badge --ip 8.8.8.8 --joined $(( $(date +%s) - 754 )) &
          sleep 4
          python render_check.py badgehidden
          taskkill //IM OrbitHelper.exe //F > /dev/null 2>&1
          ORBIT_BADGE_ALWAYS=1 "$HELPER" --orbit-toast keys x --keys &
          sleep 4
          python render_check.py keys
          taskkill //IM OrbitLauncher.exe //F > /dev/null 2>&1
          taskkill //IM OrbitHelper.exe //F > /dev/null 2>&1
          echo "== launcher.log =="
          cat "$LOCALAPPDATA/OrbitLauncher/launcher.log" 2>/dev/null
          python - <<'PY'
          import json, sys
          ok = True
          for mode in ("setup", "app", "spawn"):
              try:
                  r = json.load(open(f"selftest-{mode}.json"))
              except Exception:
                  print(f"{mode}: no result"); ok = False; continue
              print(mode, "ready:", r.get("ready"), "errors:", r.get("errors"))
              ok = ok and bool(r.get("ready")) and not r.get("errors")
          sys.exit(0 if ok else 1)
          PY

      - name: Windows feature checks
        if: steps.ver.outputs.exists == 'false'
        timeout-minutes: 8
        run: |
          python - <<'PY'
          import os, sys, time, struct, subprocess, importlib.util
          spec = importlib.util.spec_from_file_location("ol", "orbit_launcher.py")
          ol = importlib.util.module_from_spec(spec); spec.loader.exec_module(ol)
          ol.ensure_dirs()
          ok = True
          w, h, data = ol.capture_rect((0, 0, 640, 360))
          png = ol._png_bytes(w, h, (data[i * w * 4:(i + 1) * w * 4] for i in range(h)))
          from PIL import Image
          import io
          im = Image.open(io.BytesIO(png)); print("CHECK screenshot:", im.size, "colors", len(set(im.getdata())) > 5)
          ok &= im.size == (640, 360)
          ok &= ol._clipboard_put(13, "orbit test\0".encode("utf-16-le"))
          print("CHECK clipboard text set")
          dest = ol.take_roblox_screenshot((0, 0, 800, 450)); print("CHECK screenshot file:", dest, os.path.getsize(dest))
          try:
              print("CHECK presentmon asset:", ol.github_asset("GameTechDev/PresentMon", r"PresentMon-\d+\.\d+\.\d+-x64\.exe")[1])
          except Exception as e:
              print("CHECK presentmon asset lookup failed (rate limit is fine here):", e)
          t = time.time(); ol.setup_ffmpeg(); print(f"CHECK ffmpeg downloaded in {time.time() - t:.0f}s, size {ol.FFMPEG.stat().st_size // 1048576} MB")
          ol.REPLAY_DIR.mkdir(parents=True, exist_ok=True)
          cmd = ol.Replay.command(30, 8, source=("-f", "gdigrab", "-draw_mouse", "0", "-i", "desktop"))
          proc = subprocess.Popen(cmd); time.sleep(14); ol.kill_tree(proc.pid); time.sleep(1)
          print("CHECK segments:", sorted(p.name for p in ol.REPLAY_DIR.glob("seg*.ts")))
          out = ol.Replay.save(10, "CI")
          dur = subprocess.run([str(ol.FFMPEG), "-i", out], capture_output=True, text=True).stderr if out else ""
          print("CHECK replay:", out, [l.strip() for l in dur.splitlines() if "Duration" in l])
          ok &= bool(out)
          print("CHECK fps_ready:", ol.fps_ready())
          import json as _j, urllib.request as _u
          ol.OverlayServer.start(); time.sleep(1)
          st = _j.loads(_u.urlopen(f"http://127.0.0.1:{ol.OVERLAY_PORT}/state", timeout=5).read())
          print("CHECK overlay:", sorted(st)); ok &= "game" in st
          print("CHECK emoji font:", ol.emoji_source("windows"))
          me = os.getpid()
          thr, pri = ol.set_power_throttle(me, True), ol.set_priority(pid=me, cls=0x4000)
          print("CHECK tab-out guard calls:", thr, pri, ol.set_power_throttle(me, False), ol.set_priority(pid=me, cls=0x20))
          ok &= thr and pri == 1
          print("CHECK frames:", ol.summarize_frames(ol.parse_frame_times(["MsBetweenPresents"], ["6.9"] * 200)))
          sys.exit(0 if ok else 1)
          PY

      - name: Upload test screenshots
        if: always() && steps.ver.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: toast-preview.png
          if-no-files-found: ignore

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          python - "$v" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              m = re.search(rf"^## v?{re.escape(v)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
              body = m.group(1).strip() if m else ""
          except OSError:
              body = ""
          print(body or f"Orbit Launcher v{v}")
          print("\n---\n**New here?** Download **OrbitSetup.exe** below and run it. Already installed? Orbit updates itself.")
          PY
          gh release create "v$v" dist/OrbitSetup.exe dist/OrbitLauncher.exe dist/OrbitLauncher.exe.sha256 \
            --title "Orbit Launcher v$v" --notes-file notes.md
