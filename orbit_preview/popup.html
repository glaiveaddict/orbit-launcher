<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px "Segoe UI", Arial, sans-serif;
           background: #0b0814; color: #f1edff; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    .row { display: flex; gap: 6px; }
    input[type=text] { flex: 1; padding: 7px 8px; border-radius: 6px; border: 1px solid #2e2550;
                       background: #17122a; color: #f1edff; }
    button { padding: 7px 12px; border: 0; border-radius: 6px; background: linear-gradient(135deg,#9d6bff,#d946ef); color: #fff;
             font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    label { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
    #msg { min-height: 16px; color: #c4b5fd; margin-top: 6px; }
    #list { max-height: 300px; overflow-y: auto; }
    .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #333; }
    .item img { width: 36px; height: 36px; border-radius: 4px; background: #2b2d31; }
    .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item button { background: transparent; color: #aaa; padding: 2px 6px; font-size: 16px; }
    .item button:hover { color: #fff; }
    .note { color: #999; font-size: 12px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1>Orbit Item Preview</h1>
  <div class="row">
    <input id="item" type="text" placeholder="Item ID or catalog link">
    <button id="add">Add</button>
  </div>
  <div id="msg"></div>
  <label><input id="enabled" type="checkbox"> Show previews on my profile &amp; inventory</label>
  <div id="list"></div>
  <p class="note">Previews only appear in your browser, on your own pages, and are always labeled PREVIEW · NOT OWNED.</p>
  <script src="popup.js"></script>
</body>
</html>
